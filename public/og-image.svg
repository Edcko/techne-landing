<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D17"/>
      <stop offset="100%" stop-color="#12151F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8963E"/>
      <stop offset="50%" stop-color="#C49A5A"/>
      <stop offset="100%" stop-color="#B8C4D8"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8963E"/>
      <stop offset="100%" stop-color="#C49A5A"/>
    </linearGradient>
    <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C49A5A"/>
      <stop offset="100%" stop-color="#B8C4D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C49A5A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C49A5A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Constellation dots -->
  <circle cx="100" cy="100" r="2" fill="#E8963E" opacity="0.3"/>
  <circle cx="250" cy="50" r="1.5" fill="#B8C4D8" opacity="0.2"/>
  <circle cx="400" cy="150" r="2" fill="#C49A5A" opacity="0.2"/>
  <circle cx="1100" cy="80" r="2" fill="#B8C4D8" opacity="0.3"/>
  <circle cx="1000" cy="200" r="1.5" fill="#E8963E" opacity="0.2"/>
  <circle cx="150" cy="500" r="1.5" fill="#C49A5A" opacity="0.15"/>
  <circle cx="1050" cy="550" r="2" fill="#B8C4D8" opacity="0.2"/>
  <circle cx="300" cy="580" r="1" fill="#E8963E" opacity="0.15"/>
  <circle cx="900" cy="600" r="1.5" fill="#C49A5A" opacity="0.15"/>
  <circle cx="80" cy="300" r="1" fill="#9AACCC" opacity="0.15"/>
  <circle cx="1120" cy="350" r="1" fill="#E8963E" opacity="0.1"/>
  <line x1="100" y1="100" x2="250" y2="50" stroke="#1E2233" stroke-width="0.5" opacity="0.3"/>
  <line x1="250" y1="50" x2="400" y2="150" stroke="#1E2233" stroke-width="0.5" opacity="0.2"/>
  <line x1="1100" y1="80" x2="1000" y2="200" stroke="#1E2233" stroke-width="0.5" opacity="0.3"/>
  <line x1="1050" y1="550" x2="900" y2="600" stroke="#1E2233" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Glow behind eclipse -->
  <circle cx="600" cy="315" r="180" fill="url(#glow)"/>
  
  <!-- Eclipse logo -->
  <circle cx="600" cy="315" r="120" fill="url(#glow)"/>
  <clipPath id="sClip"><rect x="480" y="195" width="120" height="240"/></clipPath>
  <g clip-path="url(#sClip)" filter="url(#blur)">
    <circle cx="600" cy="315" r="90" fill="url(#sunG)"/>
    <line x1="600" y1="230" x2="600" y2="260" stroke="#E8963E" stroke-width="3" opacity="0.5"/>
    <line x1="600" y1="370" x2="600" y2="400" stroke="#E8963E" stroke-width="3" opacity="0.5"/>
    <line x1="515" y1="315" x2="535" y2="315" stroke="#E8963E" stroke-width="2" opacity="0.3"/>
    <line x1="530" y1="265" x2="545" y2="280" stroke="#E8963E" stroke-width="2" opacity="0.3"/>
    <line x1="530" y1="365" x2="545" y2="350" stroke="#E8963E" stroke-width="2" opacity="0.3"/>
  </g>
  <clipPath id="mClip"><rect x="600" y="195" width="120" height="240"/></clipPath>
  <g clip-path="url(#mClip)" filter="url(#blur)">
    <circle cx="600" cy="315" r="90" fill="#0B0D17"/>
    <path d="M600 225 A90 90 0 0 1 600 405 A70 70 0 0 0 600 225" fill="url(#moonG)"/>
    <circle cx="635" cy="290" r="8" fill="#9AACCC" opacity="0.15"/>
    <circle cx="650" cy="340" r="6" fill="#9AACCC" opacity="0.1"/>
    <circle cx="625" cy="375" r="5" fill="#9AACCC" opacity="0.08"/>
  </g>
  <circle cx="600" cy="315" r="90" fill="none" stroke="#C49A5A" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Title -->
  <text x="600" y="495" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#gold)">Techne</text>
  
  <!-- Tagline -->
  <text x="600" y="540" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="300" fill="#B8C4D8" opacity="0.6" letter-spacing="8">MASTERFUL CRAFT. INFINITE SOLUTIONS.</text>
  
  <!-- Bottom accent line -->
  <rect x="500" y="570" width="200" height="1" fill="url(#gold)" opacity="0.4" rx="0.5"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="#1E2233" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>
